<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLORB</title>
  <style>
    /* ── Reset & base ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Theme tokens ────────────────────────────────────────────── */
    :root {
      /* Glorb (default dark) */
      --bg:      #090909;
      --surface: #111111;
      --border:  #1e1e1e;
      --text:    #e8e8e8;
      --muted:   #444;
      --accent:  #00ff88;
      --danger:  #ff3b5c;
      --radius:  6px;
      --font:    'SF Mono', 'Fira Code', 'Consolas', monospace;
      --glow:    rgba(0,255,136,.25);
      --glow-btn:rgba(0,255,136,.2);
      --glow-btn-hover: rgba(0,255,136,.35);
    }
    /* Vapor — synthwave, hot-pink neon */
    :root[data-theme="vapor"] {
      --bg:      #0d0015;
      --surface: #130025;
      --border:  #2d0050;
      --text:    #f0d0ff;
      --muted:   #6644aa;
      --accent:  #ff2d78;
      --danger:  #ff6ba0;
      --glow:    rgba(255,45,120,.28);
      --glow-btn:rgba(255,45,120,.2);
      --glow-btn-hover: rgba(255,45,120,.4);
    }
    /* Amber — phosphor CRT monitor */
    :root[data-theme="amber"] {
      --bg:      #0a0800;
      --surface: #130f00;
      --border:  #2a2000;
      --text:    #ffe8b0;
      --muted:   #554400;
      --accent:  #ffb347;
      --danger:  #ff5522;
      --glow:    rgba(255,179,71,.25);
      --glow-btn:rgba(255,179,71,.2);
      --glow-btn-hover: rgba(255,179,71,.38);
    }
    /* Glacier — cold sci-fi */
    :root[data-theme="glacier"] {
      --bg:      #050810;
      --surface: #080e1c;
      --border:  #0e1c30;
      --text:    #c8e8ff;
      --muted:   #2a4a6a;
      --accent:  #4fc3f7;
      --danger:  #ff6b6b;
      --glow:    rgba(79,195,247,.25);
      --glow-btn:rgba(79,195,247,.2);
      --glow-btn-hover: rgba(79,195,247,.38);
    }
    /* ── Light mode overlay (any theme) ─────────────────────────── */
    :root[data-light] {
      --bg:      #f2f2f2;
      --surface: #ffffff;
      --border:  #d8d8d8;
      --text:    #111111;
      --muted:   #999999;
      --glow:    rgba(0,0,0,.06);
      --glow-btn:rgba(0,0,0,.06);
      --glow-btn-hover: rgba(0,0,0,.12);
    }
    :root[data-theme="vapor"][data-light]   { --accent: #cc0055; --danger: #e0004f; }
    :root[data-theme="amber"][data-light]   { --accent: #c07800; --danger: #cc3300; }
    :root[data-theme="glacier"][data-light] { --accent: #0077aa; --danger: #cc3333; }
    :root[data-light]:not([data-theme])     { --accent: #00aa55; --danger: #cc2244; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      letter-spacing: 0.03em;
      transition: background .3s, color .3s;
    }

    /* ── Layout ─────────────────────────────────────────────────── */
    .shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 48px 24px;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    header {
      text-align: center;
      user-select: none;
    }

    .logo {
      font-size: clamp(2.4rem, 8vw, 5rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--accent);
      line-height: 1;
      text-shadow: 0 0 40px var(--glow);
    }

    .tagline {
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    /* ── Waveform canvas ─────────────────────────────────────────── */
    .waveform-wrap {
      width: 100%;
      max-width: 680px;
      position: relative;
    }

    canvas#waveform {
      width: 100%;
      height: 100px;
      display: block;
      border-bottom: 1px solid var(--border);
    }

    /* ── Controls ────────────────────────────────────────────────── */
    .controls {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .label {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      min-width: 68px;
    }

    /* Duration slider */
    .slider-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    input[type=range] {
      -webkit-appearance: none;
      flex: 1;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(0,255,136,.5);
      cursor: pointer;
      transition: transform .15s;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }

    .duration-val {
      min-width: 52px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      text-align: right;
    }

    /* Quality pills */
    .pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 5px 14px;
      border: 1px solid var(--border);
      border-radius: 100px;
      background: transparent;
      color: var(--muted);
      font-family: var(--font);
      font-size: 11px;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all .15s;
      text-transform: uppercase;
    }
    .pill:hover  { border-color: var(--accent); color: var(--accent); }
    .pill.active {
      border-color: var(--accent);
      color: var(--bg);
      background: var(--accent);
    }

    /* ── Generate button ─────────────────────────────────────────── */
    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    #btn-generate {
      flex: 1;
      min-width: 180px;
      padding: 16px 28px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity .15s, transform .1s, box-shadow .15s;
      box-shadow: 0 0 24px var(--glow-btn);
    }
    #btn-generate:hover:not(:disabled) {
      opacity: .88;
      transform: translateY(-1px);
      box-shadow: 0 0 36px var(--glow-btn-hover);
    }
    #btn-generate:active:not(:disabled) { transform: translateY(0); }
    #btn-generate:disabled { opacity: .35; cursor: not-allowed; }

    #btn-play, #btn-download, #btn-viz {
      padding: 16px 20px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .15s;
      display: none;
    }
    #btn-play:hover, #btn-download:hover, #btn-viz:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    #btn-play.playing {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* ── Visualizer overlay ──────────────────────────────────────────*/
    #viz-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 50;
      cursor: none;
    }
    #viz-overlay.active { display: block; }
    #viz-canvas { display: block; width: 100%; height: 100%; }
    #viz-close {
      position: absolute;
      top: 24px; right: 28px;
      background: transparent;
      border: 1px solid #222;
      border-radius: var(--radius);
      color: #333;
      font-family: var(--font);
      font-size: 11px;
      letter-spacing: 0.14em;
      padding: 7px 14px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all .2s;
      z-index: 51;
    }
    #viz-close:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Mode pills (larger, primary) ───────────────────────────────*/
    .mode-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mode-pill {
      padding: 8px 20px;
      border: 1px solid var(--border);
      border-radius: 100px;
      background: transparent;
      color: var(--muted);
      font-family: var(--font);
      font-size: 12px;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all .15s;
      text-transform: uppercase;
    }
    .mode-pill:hover { border-color: var(--accent); color: var(--accent); }
    .mode-pill.active {
      border-color: var(--accent);
      color: var(--bg);
      background: var(--accent);
    }

    /* Nature sub-variant pills */
    #nature-variants {
      display: none;
      gap: 6px;
      flex-wrap: wrap;
    }
    #nature-variants.visible { display: flex; }
    #btn-settings {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: var(--font);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0;
      transition: color .15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #btn-settings:hover { color: var(--text); }
    #btn-settings .chevron { transition: transform .2s; display: inline-block; }
    #btn-settings.open .chevron { transform: rotate(180deg); }

    #settings-panel {
      display: none;
      padding: 16px 0 4px;
      border-top: 1px solid var(--border);
    }
    #settings-panel.open { display: block; }
    #status {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.12em;
      height: 16px;
      text-align: center;
    }
    #status.active { color: var(--accent); }
    #status.error  { color: var(--danger); }
  </style>
</head>
<body>
<div class="shell">

  <header>
    <div class="logo">GLORB</div>
    <div class="tagline">organic sound generator</div>
  </header>

  <!-- Mode selector -->
  <div class="controls" style="gap:16px;">
    <div class="row">
      <span class="label">Mode</span>
      <div class="mode-pills" id="mode-pills">
        <button class="mode-pill active" data-mode="glorb">Glorb</button>
        <button class="mode-pill" data-mode="retro">Retro</button>
        <button class="mode-pill" data-mode="nature">Nature</button>
        <button class="mode-pill" data-mode="scifi">Sci-Fi</button>
        <button class="mode-pill" data-mode="haptic">Haptic</button>
        <button class="mode-pill" data-mode="radio">Radio</button>
        <button class="mode-pill" data-mode="ui-pack">UI Pack</button>
      </div>
    </div>
    <div class="row" id="nature-row" style="display:none">
      <span class="label">Variant</span>
      <div class="pills" id="nature-variants">
        <button class="pill active" data-variant="random">Random</button>
        <button class="pill" data-variant="rain">Rain</button>
        <button class="pill" data-variant="fire">Fire</button>
        <button class="pill" data-variant="insects">Insects</button>
      </div>
    </div>
  </div>

  <!-- Waveform -->
  <div class="waveform-wrap">
    <canvas id="waveform" width="1360" height="200"></canvas>
  </div>

  <!-- Controls -->
  <div class="controls">

    <div class="row">
      <span class="label">Duration</span>
      <div class="slider-wrap">
        <input type="range" id="slider-dur" min="1" max="120" step="1" value="10" />
        <span class="duration-val" id="dur-val">10s</span>
      </div>
    </div>

    <div class="row actions">
      <button id="btn-generate">Generate</button>
      <button id="btn-play">▶ Play</button>
      <button id="btn-viz">⬡ Visualize</button>
      <button id="btn-download">↓ Save</button>
    </div>

    <!-- Settings toggle -->
    <div>
      <button id="btn-settings">
        <span>⚙ settings</span>
        <span class="chevron">▾</span>
      </button>
      <div id="settings-panel">
        <div class="row" style="margin-bottom:14px">
          <span class="label">Appearance</span>
          <div class="pills">
            <button class="pill active" id="btn-dark">Dark</button>
            <button class="pill" id="btn-light">Light</button>
          </div>
        </div>
        <div class="row" style="margin-bottom:14px">
          <span class="label">Theme</span>
          <div class="pills" id="theme-pills">
            <button class="pill active" data-theme="">Glorb</button>
            <button class="pill" data-theme="vapor">Vapor</button>
            <button class="pill" data-theme="amber">Amber</button>
            <button class="pill" data-theme="glacier">Glacier</button>
          </div>
        </div>
        <div class="row">
          <span class="label">Quality</span>
          <div class="pills" id="quality-pills">
            <button class="pill" data-q="standard">Standard</button>
            <button class="pill active" data-q="high">High</button>
            <button class="pill" data-q="studio">Studio</button>
            <button class="pill" data-q="float">Float</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div id="status">—</div>

</div>

<!-- ── Visualizer overlay ─────────────────────────────────────────── -->
<div id="viz-overlay">
  <canvas id="viz-canvas"></canvas>
  <button id="viz-close">✕ close</button>
</div>

<script>
  /* ── State ──────────────────────────────────────────────────────── */
  let audioCtx    = null;
  let audioBuffer = null;
  let sourceNode  = null;
  let analyser    = null;
  let isPlaying   = false;
  let selectedQ       = 'high';
  let selectedMode    = 'glorb';
  let selectedVariant = 'random';
  let animId      = null;
  let vizAnimId   = null;
  let vizActive   = false;

  /* ── Elements ───────────────────────────────────────────────────── */
  const canvas      = document.getElementById('waveform');
  const ctx2d       = canvas.getContext('2d');
  const btnGen      = document.getElementById('btn-generate');
  const btnPlay     = document.getElementById('btn-play');
  const btnViz      = document.getElementById('btn-viz');
  const btnDl       = document.getElementById('btn-download');
  const sliderDur   = document.getElementById('slider-dur');
  const durVal      = document.getElementById('dur-val');
  const statusEl    = document.getElementById('status');
  const pills       = document.querySelectorAll('#quality-pills .pill');
  const vizOverlay  = document.getElementById('viz-overlay');
  const vizCanvas   = document.getElementById('viz-canvas');
  const vizCtx      = vizCanvas.getContext('2d');
  const btnVizClose = document.getElementById('viz-close');

  /* ── Duration slider ────────────────────────────────────────────── */
  sliderDur.addEventListener('input', () => {
    durVal.textContent = sliderDur.value + 's';
  });

  /* ── Mode pills ─────────────────────────────────────────────────── */
  const modePills  = document.querySelectorAll('.mode-pill');
  const natureRow  = document.getElementById('nature-row');
  const natPills   = document.querySelectorAll('#nature-variants .pill');

  modePills.forEach(p => {
    p.addEventListener('click', () => {
      modePills.forEach(x => x.classList.remove('active'));
      p.classList.add('active');
      selectedMode = p.dataset.mode;
      natureRow.style.display = selectedMode === 'nature' ? 'flex' : 'none';
      // UI Pack: hide duration slider (it generates fixed set)
      document.querySelector('.slider-wrap').parentElement.style.display =
        selectedMode === 'ui-pack' ? 'none' : 'flex';
      // Save button label hints ZIP vs WAV
      btnDl.textContent = selectedMode === 'ui-pack' ? '↓ ZIP' : '↓ Save';
    });
  });

  natPills.forEach(p => {
    p.addEventListener('click', () => {
      natPills.forEach(x => x.classList.remove('active'));
      p.classList.add('active');
      selectedVariant = p.dataset.variant;
    });
  });

  /* ── Settings toggle ────────────────────────────────────────────── */
  const btnSettings    = document.getElementById('btn-settings');
  const settingsPanel  = document.getElementById('settings-panel');
  btnSettings.addEventListener('click', () => {
    btnSettings.classList.toggle('open');
    settingsPanel.classList.toggle('open');
  });

  /* ── Theme & light/dark ─────────────────────────────────────────── */
  const root       = document.documentElement;
  const themePills = document.querySelectorAll('#theme-pills .pill');
  const btnDark    = document.getElementById('btn-dark');
  const btnLight   = document.getElementById('btn-light');

  function applyTheme(theme, light) {
    if (theme) root.setAttribute('data-theme', theme);
    else       root.removeAttribute('data-theme');
    if (light) root.setAttribute('data-light', '');
    else       root.removeAttribute('data-light');
    localStorage.setItem('glorb-theme', theme || '');
    localStorage.setItem('glorb-light', light ? '1' : '');
    // Redraw idle line with new colors
    if (!audioBuffer) drawIdle();
    else drawWaveform(audioBuffer, 1);
  }

  themePills.forEach(p => {
    p.addEventListener('click', () => {
      themePills.forEach(x => x.classList.remove('active'));
      p.classList.add('active');
      applyTheme(p.dataset.theme, root.hasAttribute('data-light'));
    });
  });

  btnDark.addEventListener('click', () => {
    btnDark.classList.add('active');
    btnLight.classList.remove('active');
    applyTheme(root.getAttribute('data-theme') || '', false);
  });
  btnLight.addEventListener('click', () => {
    btnLight.classList.add('active');
    btnDark.classList.remove('active');
    applyTheme(root.getAttribute('data-theme') || '', true);
  });

  // Restore persisted theme on load
  (function restoreTheme() {
    const t = localStorage.getItem('glorb-theme') || '';
    const l = localStorage.getItem('glorb-light') === '1';
    if (t) {
      const pill = [...themePills].find(p => p.dataset.theme === t);
      if (pill) { themePills.forEach(x => x.classList.remove('active')); pill.classList.add('active'); }
    }
    if (l) { btnLight.classList.add('active'); btnDark.classList.remove('active'); }
    applyTheme(t, l);
  })();

  /* ── Quality pills ──────────────────────────────────────────────── */
  pills.forEach(p => {
    p.addEventListener('click', () => {
      pills.forEach(x => x.classList.remove('active'));
      p.classList.add('active');
      selectedQ = p.dataset.q;
    });
  });

  /* ── Status helpers ─────────────────────────────────────────────── */
  function setStatus(msg, cls = '') {
    statusEl.textContent = msg;
    statusEl.className = cls;
  }

  /* ── Waveform drawing (main UI) ─────────────────────────────────── */
  function getCSSVar(name) {
    return getComputedStyle(root).getPropertyValue(name).trim();
  }

  function drawWaveform(buffer, progress = 1) {
    const W = canvas.width, H = canvas.height;
    ctx2d.clearRect(0, 0, W, H);
    const data  = buffer.getChannelData(0);
    const step  = Math.ceil(data.length / W);
    const drawn = Math.floor(W * progress);
    const accentDim = getCSSVar('--border');
    const accent    = getCSSVar('--accent');

    ctx2d.strokeStyle = accentDim;
    ctx2d.lineWidth   = 1.5;
    ctx2d.beginPath();
    for (let x = 0; x < W; x++) {
      let max = 0;
      for (let i = 0; i < step; i++) { const v = Math.abs(data[x*step+i]||0); if(v>max) max=v; }
      const y = (1-max)*H/2, y2 = (1+max)*H/2;
      if (x===0) ctx2d.moveTo(x,y); ctx2d.lineTo(x,y); ctx2d.lineTo(x,y2);
    }
    ctx2d.stroke();

    if (drawn > 0) {
      ctx2d.strokeStyle = accent;
      ctx2d.shadowColor = accent;
      ctx2d.shadowBlur  = 6;
      ctx2d.lineWidth   = 1.5;
      ctx2d.beginPath();
      for (let x = 0; x < drawn; x++) {
        let max = 0;
        for (let i = 0; i < step; i++) { const v = Math.abs(data[x*step+i]||0); if(v>max) max=v; }
        const y = (1-max)*H/2, y2 = (1+max)*H/2;
        if (x===0) ctx2d.moveTo(x,y); ctx2d.lineTo(x,y); ctx2d.lineTo(x,y2);
      }
      ctx2d.stroke();
      ctx2d.shadowBlur = 0;
    }
  }

  function drawIdle() {
    const W = canvas.width, H = canvas.height;
    ctx2d.clearRect(0, 0, W, H);
    ctx2d.strokeStyle = getCSSVar('--border');
    ctx2d.lineWidth = 1;
    ctx2d.beginPath();
    ctx2d.moveTo(0, H/2); ctx2d.lineTo(W, H/2);
    ctx2d.stroke();
  }
  drawIdle();

  /* ── Playback progress loop (main UI) ──────────────────────────── */
  function startProgressLoop(startedAt) {
    function tick() {
      if (!isPlaying || !audioBuffer) return;
      const elapsed  = audioCtx.currentTime - startedAt;
      const progress = Math.min(elapsed / audioBuffer.duration, 1);
      if (!vizActive) drawWaveform(audioBuffer, progress);
      if (progress < 1) animId = requestAnimationFrame(tick);
      else stopPlayback();
    }
    animId = requestAnimationFrame(tick);
  }

  /* ── Stop playback ──────────────────────────────────────────────── */
  function stopPlayback() {
    if (sourceNode)  { try { sourceNode.stop(); } catch(_){} sourceNode = null; }
    if (animId)      { cancelAnimationFrame(animId);    animId    = null; }
    if (vizAnimId)   { cancelAnimationFrame(vizAnimId); vizAnimId = null; }
    isPlaying = false;
    btnPlay.textContent = '▶ Play';
    btnPlay.classList.remove('playing');
    if (audioBuffer) drawWaveform(audioBuffer, 1);
  }

  /* ── Start audio (shared by Play and Visualize) ─────────────────── */
  function startAudio() {
    if (!audioBuffer) return null;
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    // Create analyser and wire it
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.8;

    sourceNode = audioCtx.createBufferSource();
    sourceNode.buffer = audioBuffer;
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
    sourceNode.onended = () => {
      stopPlayback();
      if (vizActive) closeViz();
    };

    const startedAt = audioCtx.currentTime;
    sourceNode.start();
    isPlaying = true;
    return startedAt;
  }

  /* ── Play button ────────────────────────────────────────────────── */
  btnPlay.addEventListener('click', () => {
    if (!audioBuffer) return;
    if (isPlaying) { stopPlayback(); return; }
    const startedAt = startAudio();
    btnPlay.textContent = '■ Stop';
    btnPlay.classList.add('playing');
    startProgressLoop(startedAt);
  });

  /* ── Download button ────────────────────────────────────────────── */
  btnDl.addEventListener('click', async () => {
    if (selectedMode === 'ui-pack') {
      // Fetch individual WAVs as ZIP
      setStatus('building zip…', 'active');
      btnDl.disabled = true;
      try {
        const res  = await fetch(`/ui-pack-zip?quality=${selectedQ}`);
        const blob = await res.blob();
        const a    = document.createElement('a');
        a.href     = URL.createObjectURL(blob);
        a.download = `glorb_ui_pack_${Date.now()}.zip`;
        a.click();
        setStatus('zip downloaded — 7 individual wavs');
      } catch (err) {
        setStatus(err.message, 'error');
      } finally {
        btnDl.disabled = false;
      }
      return;
    }
    if (!btnDl._wavBlob) return;
    const a   = document.createElement('a');
    a.href    = URL.createObjectURL(btnDl._wavBlob);
    a.download = `glorb_${selectedMode}_${Date.now()}.wav`;
    a.click();
  });

  /* ── Generate ───────────────────────────────────────────────────── */
  btnGen.addEventListener('click', async () => {
    stopPlayback();
    btnGen.disabled = true;
    btnPlay.style.display = btnViz.style.display = btnDl.style.display = 'none';
    setStatus('generating…', 'active');
    drawIdle();

    try {
      const body = {
        duration: +sliderDur.value,
        quality: selectedQ,
        mode: selectedMode,
      };
      if (selectedMode === 'nature' && selectedVariant !== 'random')
        body.variant = selectedVariant;

      const res = await fetch('/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error(`Server error ${res.status}`);

      const isZip = res.headers.get('content-type')?.includes('zip');

      if (isZip) {
        // fallback (shouldn't happen with current server)
        const blob = await res.blob();
        btnDl._wavBlob  = blob;
        btnDl._isZip    = true;
        btnDl.style.display = 'inline-block';
        audioBuffer = null;
        drawIdle();
        setStatus('ui pack ready — download to unzip');
      } else {
        const arrayBuf = await res.arrayBuffer();
        const wavBlob  = new Blob([arrayBuf], { type: 'audio/wav' });
        if (!audioCtx) audioCtx = new AudioContext();
        audioBuffer = await audioCtx.decodeAudioData(arrayBuf.slice());
        drawWaveform(audioBuffer, 1);
        btnDl._wavBlob = wavBlob;
        btnDl._isZip   = false;
        btnPlay.style.display = btnViz.style.display = btnDl.style.display = 'inline-block';
        const label = selectedMode === 'ui-pack'
          ? `preview — ${audioBuffer.duration.toFixed(1)}s · 7 sounds · save = zip`
          : `ready — ${audioBuffer.duration.toFixed(1)}s · ${audioBuffer.sampleRate/1000}kHz · stereo`;
        setStatus(label);
      }
    } catch (err) {
      setStatus(err.message, 'error');
    } finally {
      btnGen.disabled = false;
    }
  });

  /* ══════════════════════════════════════════════════════════════════
     VISUALIZER
  ══════════════════════════════════════════════════════════════════ */

  function resizeVizCanvas() {
    vizCanvas.width  = vizCanvas.offsetWidth  * window.devicePixelRatio;
    vizCanvas.height = vizCanvas.offsetHeight * window.devicePixelRatio;
    vizCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
  }
  window.addEventListener('resize', () => { if (vizActive) resizeVizCanvas(); });

  function openViz() {
    if (!audioBuffer) return;
    stopPlayback();
    vizActive = true;
    vizOverlay.classList.add('active');
    resizeVizCanvas();

    const startedAt = startAudio();
    btnPlay.textContent = '▶ Play';
    startProgressLoop(startedAt);
    drawViz();
  }

  function closeViz() {
    vizActive = false;
    vizOverlay.classList.remove('active');
    if (vizAnimId) { cancelAnimationFrame(vizAnimId); vizAnimId = null; }
    stopPlayback();
  }

  btnViz.addEventListener('click', openViz);
  btnVizClose.addEventListener('click', closeViz);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && vizActive) closeViz(); });

  /* ── Visualizer draw loop ───────────────────────────────────────── */
  function hexToRgb(hex) {
    hex = hex.replace('#', '').trim();
    if (hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
    const n = parseInt(hex, 16);
    return [(n>>16)&255, (n>>8)&255, n&255];
  }

  function drawViz() {
    const W = vizCanvas.offsetWidth;
    const H = vizCanvas.offsetHeight;
    const cx = W / 2, cy = H / 2;
    const [ar, ag, ab] = hexToRgb(getCSSVar('--accent'));

    const freqData  = new Uint8Array(analyser.frequencyBinCount);
    const timeData  = new Uint8Array(analyser.fftSize);
    const N_BARS    = 180;
    const INNER_R   = Math.min(W, H) * 0.18;
    const MAX_BAR_H = Math.min(W, H) * 0.28;
    const RING_R    = Math.min(W, H) * 0.48;

    function frame() {
      if (!vizActive) return;
      vizAnimId = requestAnimationFrame(frame);

      analyser.getByteFrequencyData(freqData);
      analyser.getByteTimeDomainData(timeData);

      vizCtx.fillStyle = 'rgba(0,0,0,0.18)';
      vizCtx.fillRect(0, 0, W, H);

      // ── Radial frequency bars ──────────────────────────────────── //
      for (let i = 0; i < N_BARS; i++) {
        const angle  = (i / N_BARS) * Math.PI * 2 - Math.PI / 2;
        const binIdx = Math.floor((i / N_BARS) * (freqData.length * 0.75));
        const amp    = freqData[binIdx] / 255;
        const barH   = amp * MAX_BAR_H;
        const alpha  = 0.5 + amp * 0.5;
        const r = Math.floor(ar * (0.3 + amp * 0.7));
        const g = Math.floor(ag * (0.3 + amp * 0.7));
        const b = Math.floor(ab * (0.3 + amp * 0.7));
        const x1 = cx + Math.cos(angle) * INNER_R;
        const y1 = cy + Math.sin(angle) * INNER_R;
        const x2 = cx + Math.cos(angle) * (INNER_R + barH);
        const y2 = cy + Math.sin(angle) * (INNER_R + barH);
        vizCtx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
        vizCtx.lineWidth   = (W / N_BARS) * 0.7;
        vizCtx.shadowColor = `rgba(${ar},${ag},${ab},${amp * 0.6})`;
        vizCtx.shadowBlur  = amp * 18;
        vizCtx.beginPath();
        vizCtx.moveTo(x1, y1);
        vizCtx.lineTo(x2, y2);
        vizCtx.stroke();
      }
      vizCtx.shadowBlur = 0;

      // ── Oscilloscope ring ──────────────────────────────────────── //
      const sliceAngle = (Math.PI * 2) / timeData.length;
      vizCtx.strokeStyle = `rgba(${ar},${ag},${ab},0.55)`;
      vizCtx.lineWidth   = 1.5;
      vizCtx.shadowColor = getCSSVar('--accent');
      vizCtx.shadowBlur  = 8;
      vizCtx.beginPath();
      for (let i = 0; i < timeData.length; i++) {
        const v     = timeData[i] / 128.0 - 1.0;
        const r     = RING_R + v * (Math.min(W,H) * 0.05);
        const angle = i * sliceAngle - Math.PI / 2;
        const x     = cx + r * Math.cos(angle);
        const y     = cy + r * Math.sin(angle);
        if (i === 0) vizCtx.moveTo(x, y); else vizCtx.lineTo(x, y);
      }
      vizCtx.closePath();
      vizCtx.stroke();
      vizCtx.shadowBlur = 0;

      // ── Centre pulse circle ────────────────────────────────────── //
      const avgFreq = freqData.slice(0, 8).reduce((a,b) => a+b, 0) / 8 / 255;
      const pulseR  = INNER_R * (0.7 + avgFreq * 0.6);
      const grad    = vizCtx.createRadialGradient(cx, cy, 0, cx, cy, pulseR);
      grad.addColorStop(0, `rgba(${ar},${ag},${ab},${0.15 + avgFreq * 0.3})`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      vizCtx.fillStyle = grad;
      vizCtx.beginPath();
      vizCtx.arc(cx, cy, pulseR, 0, Math.PI * 2);
      vizCtx.fill();

      // ── GLORB wordmark ─────────────────────────────────────────── //
      vizCtx.fillStyle    = `rgba(${ar},${ag},${ab},${0.08 + avgFreq * 0.12})`;
      vizCtx.font         = `900 ${Math.floor(Math.min(W,H) * 0.055)}px 'SF Mono','Fira Code',monospace`;
      vizCtx.textAlign    = 'center';
      vizCtx.textBaseline = 'middle';
      vizCtx.letterSpacing = '-0.04em';
      vizCtx.fillText('GLORB', cx, cy);
    }

    frame();
  }
</script>
</body>
